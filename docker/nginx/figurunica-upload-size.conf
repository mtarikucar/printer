# ─────────────────────────────────────────────────────────────────────────────
# Reference snippet — NOT auto-applied. The production reverse proxy (host nginx
# on the VPS in front of the app container at 127.0.0.1:3005) is managed OUTSIDE
# this repo.
#
# Since chunked uploads landed, 3D models have NO size limit: the browser slices
# the file and posts 8 MB chunks to /api/uploads/chunk, each streamed straight
# to disk. So the proxy never sees a 350 MB body — it only needs to allow one
# chunk. The client also halves its chunk size whenever it gets a 413, so an
# unchanged proxy still works, just with more requests.
#
# 32m is comfortable headroom over the 8 MB chunk (plus multipart overhead on
# the small-file path). nginx's default is 1m.
#
# Fix on the VPS: add the directive below to the figurunica server block (or
# globally in http{}), then `nginx -t && systemctl reload nginx`.
#
# The timeouts matter more than the size now: a slow uplink can hold a single
# chunk open for a while, and the final claim request does a rename of a
# multi-hundred-megabyte file.
# ─────────────────────────────────────────────────────────────────────────────

server {
    server_name figurunica.com www.figurunica.com;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream chunks through instead of buffering each one to a temp file.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ... your existing TLS (listen 443 ssl; ssl_certificate ...) lines stay as-is.
}
