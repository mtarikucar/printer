services:
  postgres:
    image: postgres:16-alpine
    container_name: printer_postgres
    environment:
      POSTGRES_USER: printer
      POSTGRES_PASSWORD: printer
      POSTGRES_DB: printer
    volumes:
      - printer_pgdata:/var/lib/postgresql/data
    networks:
      - printer_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printer"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: printer_redis
    # Without a volume every container recreate wipes the delayed and repeatable
    # jobs: payment deadlines, SLA sweeps, model-approval reminders. AOF so a
    # restart replays them instead of losing the ones scheduled since the last
    # snapshot.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - printer_redis:/data
    networks:
      - printer_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: ghcr.io/mtarikucar/printer/worker:latest
    container_name: printer_migrate
    # `migrate` (not `push`): deterministic + non-interactive. `push` prompts on
    # create-vs-rename ambiguity and aborts in this non-TTY container, silently
    # skipping schema changes. Requires drizzle/ + meta/_journal.json in the image
    # (both committed) and the DB baselined once (see scripts/db/prod-baseline.sql).
    command: ["npx", "drizzle-kit", "migrate"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://printer:printer@postgres:5432/printer
    networks:
      - printer_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/mtarikucar/printer/app:latest
    container_name: printer_app
    ports:
      - "3005:3000"
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://printer:printer@postgres:5432/printer
      REDIS_URL: redis://redis:6379
      ORT_NUM_THREADS: "4"
    volumes:
      - printer_uploads:/app/uploads
    networks:
      - printer_network
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    image: ghcr.io/mtarikucar/printer/worker:latest
    container_name: printer_worker
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://printer:printer@postgres:5432/printer
      REDIS_URL: redis://redis:6379
    # Mesh processing is the most memory-hungry work this system does and it
    # shares a host with postgres. Without a limit the kernel OOM killer picks
    # the biggest RSS, which can be the database.
    mem_limit: 2g
    volumes:
      - printer_uploads:/app/uploads
    networks:
      - printer_network
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  printer_pgdata:
  printer_uploads:
  printer_redis:

networks:
  printer_network:
    driver: bridge
